<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Fundo infinito de tela cheia para Splash Screen -->
    <radialGradient id="splashBg" cx="50%" cy="52%" r="60%">
      <stop offset="0%" stop-color="#1c2028"/>
      <stop offset="45%" stop-color="#111318"/>
      <stop offset="100%" stop-color="#08090c"/>
    </radialGradient>

    <!-- Luz de palco (Spotlight) no chao -->
    <radialGradient id="floorSpot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#384354" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#1c222b" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#08090c" stop-opacity="0"/>
    </radialGradient>

    <filter id="motionBlur" x="-30%" y="-10%" width="160%" height="120%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4.8 0.9"/>
    </filter>

    <filter id="shadowBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.8"/>
    </filter>

    <linearGradient id="metalBody" x1="16" y1="0" x2="84" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b0d10"/>
      <stop offset="10%" stop-color="#252a32"/>
      <stop offset="24%" stop-color="#6e7b8c"/>
      <stop offset="33%" stop-color="#eef5ff"/>
      <stop offset="41%" stop-color="#8593a6"/>
      <stop offset="56%" stop-color="#22272f"/>
      <stop offset="74%" stop-color="#12151a"/>
      <stop offset="88%" stop-color="#3a424e"/>
      <stop offset="100%" stop-color="#0b0d10"/>
    </linearGradient>

    <linearGradient id="vLighting" x1="0" y1="16" x2="0" y2="82" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="28%" stop-color="#000000" stop-opacity="0.12"/>
      <stop offset="48%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="52.5%" stop-color="#ffffff" stop-opacity="0.48"/>
      <stop offset="55.5%" stop-color="#000000" stop-opacity="0.58"/>
      <stop offset="78%" stop-color="#000000" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="lobeLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="75%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="lobeDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="25%" stop-color="#07080a" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#07080a" stop-opacity="0.42"/>
      <stop offset="75%" stop-color="#07080a" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="rimGlow" x1="16" y1="0" x2="84" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="20%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="33%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="46%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="72%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="88%" stop-color="#a8b8d0" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="ringGlow" x1="25" y1="0" x2="75" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="32%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#000000" stop-opacity="0.35"/>
      <stop offset="85%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="totemClip">
      <path d="M 46,18 C 46,16 54,16 54,18 L 53.5,35 C 55,38 58,40 64,42 C 74,45 84,47 84,52 C 84,57 74,59 64,62 C 58,64 54,66 53,70 L 51.5,81 C 51,82.5 49,82.5 48.5,81 L 47,70 C 46,66 42,64 36,62 C 26,59 16,57 16,52 C 16,47 26,45 36,42 C 42,40 45,38 46.5,35 Z"/>
    </clipPath>
  </defs>

  <!-- Fundo da Splash Screen -->
  <rect width="200" height="200" fill="url(#splashBg)"/>

  <!-- Container centralizado na tela -->
  <g transform="translate(50, 50)">
    <!-- Reflexo difuso de luz na mesa -->
    <ellipse cx="50" cy="84" rx="42" ry="8" fill="url(#floorSpot)"/>

    <!-- Ondas de Loading sutis no chao (Efeito Splash Screen) -->
    <ellipse class="pulse-ring" cx="50" cy="82.5" rx="12" ry="2.2" fill="none" stroke="#6e7b8c" stroke-width="0.3"/>
    <ellipse class="pulse-ring r2" cx="50" cy="82.5" rx="12" ry="2.2" fill="none" stroke="#6e7b8c" stroke-width="0.25"/>

    <!-- Sombra projetada na mesa -->
    <ellipse class="shadow" cx="50" cy="83.2" rx="17" ry="2.8" fill="#000000" opacity="0.65" filter="url(#shadowBlur)"/>
    <ellipse class="shadow-core" cx="50" cy="82.2" rx="4.5" ry="0.9" fill="#000000" opacity="0.9"/>

    <!-- Precessao e Rotacao do Piao -->
    <g class="wobble">
      <g class="buzz">
        <g clip-path="url(#totemClip)">
          <rect class="env-shift" x="-15" y="0" width="130" height="100" fill="url(#metalBody)"/>

          <g filter="url(#motionBlur)">
            <path class="lobe l1" d="M 47,16 L 53,16 L 53,35 C 57,40 68,45 76,52 C 68,59 57,64 52,70 L 50,82 L 48,70 C 40,64 25,59 18,52 C 25,45 40,40 47,35 Z" fill="url(#lobeLight)"/>
            <path class="lobe l2" d="M 47,16 L 53,16 L 53,35 C 57,40 68,45 76,52 C 68,59 57,64 52,70 L 50,82 L 48,70 C 40,64 25,59 18,52 C 25,45 40,40 47,35 Z" fill="url(#lobeDark)"/>
            <path class="lobe l3" d="M 47,16 L 53,16 L 53,35 C 57,40 68,45 76,52 C 68,59 57,64 52,70 L 50,82 L 48,70 C 40,64 25,59 18,52 C 25,45 40,40 47,35 Z" fill="url(#lobeLight)"/>
          </g>

          <rect x="0" y="0" width="100" height="100" fill="url(#vLighting)"/>

          <g class="lathe-rings">
            <path d="M 46.5,24 C 46.5,24.6 53.5,24.6 53.5,24" fill="none" stroke="url(#ringGlow)" stroke-width="0.35"/>
            <path d="M 46.2,35 C 46.2,35.9 53.8,35.9 53.8,35" fill="none" stroke="#0b0d10" stroke-width="0.4" opacity="0.5"/>
            <path d="M 38,40.5 C 38,42.3 62,42.3 62,40.5" fill="none" stroke="url(#ringGlow)" stroke-width="0.4" opacity="0.75"/>
            <path d="M 25,46.5 C 25,49.2 75,49.2 75,46.5" fill="none" stroke="url(#ringGlow)" stroke-width="0.45" opacity="0.8"/>
            <path d="M 27,59 C 27,61.6 73,61.6 73,59" fill="none" stroke="url(#ringGlow)" stroke-width="0.4" opacity="0.55"/>
            <path d="M 38,64 C 38,66 62,66 62,64" fill="none" stroke="#0b0d10" stroke-width="0.4" opacity="0.5"/>
            <path d="M 47.5,73 C 47.5,74 52.5,74 52.5,73" fill="none" stroke="url(#ringGlow)" stroke-width="0.35" opacity="0.6"/>
          </g>

          <path d="M 16,52 C 16,55.8 30,58.8 50,58.8 C 70,58.8 84,55.8 84,52" fill="none" stroke="#08090c" stroke-width="1.1" opacity="0.85"/>
          <path class="rim-shimmer" d="M 16,51.7 C 16,55.5 30,58.5 50,58.5 C 70,58.5 84,55.5 84,51.7" fill="none" stroke="url(#rimGlow)" stroke-width="0.8"/>
        </g>

        <ellipse cx="50" cy="17.5" rx="4" ry="0.85" fill="url(#metalBody)" stroke="#16191d" stroke-width="0.4"/>
        <ellipse class="top-glint" cx="49" cy="17.4" rx="2" ry="0.35" fill="#ffffff" opacity="0.6"/>

        <path d="M 46,18 C 46,16 54,16 54,18 L 53.5,35 C 55,38 58,40 64,42 C 74,45 84,47 84,52 C 84,57 74,59 64,62 C 58,64 54,66 53,70 L 51.5,81 C 51,82.5 49,82.5 48.5,81 L 47,70 C 46,66 42,64 36,62 C 26,59 16,57 16,52 C 16,47 26,45 36,42 C 42,40 45,38 46.5,35 Z" fill="none" stroke="#14171c" stroke-width="0.55" stroke-linejoin="round"/>
      </g>
    </g>
  </g>

  <style>
    .wobble { animation: w 3.4s ease-in-out infinite; transform-origin: 50px 81px; }
    .buzz { animation: b 0.05s linear infinite; transform-origin: 50px 81px; }
    .env-shift { animation: es 3.4s ease-in-out infinite; }
    .lobe { transform-origin: 50px 52px; }
    .l1 { animation: spinLobe 0.36s linear infinite; }
    .l2 { animation: spinLobe 0.36s linear infinite; animation-delay: -0.12s; }
    .l3 { animation: spinLobe 0.36s linear infinite; animation-delay: -0.24s; }
    .rim-shimmer { animation: rShim 0.11s ease-in-out infinite alternate; }
    .lathe-rings { animation: lRing 0.09s ease-in-out infinite alternate; }
    .top-glint { animation: rShim 0.15s ease-in-out infinite alternate; }
    .shadow { animation: sh 3.4s ease-in-out infinite; transform-origin: 50px 83px; }
    .shadow-core { animation: shCore 0.05s linear infinite; }
    .pulse-ring { animation: pRing 2.4s cubic-bezier(0.1, 0.5, 0.3, 1) infinite; transform-origin: 50px 82.5px; }
    .pulse-ring.r2 { animation-delay: -1.2s; }

    @keyframes w {
      0%, 100% { transform: rotate(-2.3deg); }
      50% { transform: rotate(2.5deg); }
    }
    @keyframes b {
      0%, 100% { transform: translateX(0px); }
      50% { transform: translateX(0.18px); }
    }
    @keyframes es {
      0%, 100% { transform: translateX(-2.5px); }
      50% { transform: translateX(2.5px); }
    }
    @keyframes spinLobe {
      0% { transform: translateX(-34px) scaleX(0.5); opacity: 0; }
      30% { opacity: 0.9; }
      50% { transform: translateX(0px) scaleX(1.3); opacity: 1; }
      70% { opacity: 0.9; }
      100% { transform: translateX(34px) scaleX(0.5); opacity: 0; }
    }
    @keyframes rShim {
      0% { opacity: 0.75; transform: translateX(-0.8px); }
      100% { opacity: 1; transform: translateX(0.8px); }
    }
    @keyframes lRing {
      0% { opacity: 0.65; transform: translateX(0.5px); }
      100% { opacity: 1; transform: translateX(-0.5px); }
    }
    @keyframes sh {
      0%, 100% { transform: translateX(-1.8px) scaleX(0.94); opacity: 0.55; }
      50% { transform: translateX(1.8px) scaleX(1.06); opacity: 0.72; }
    }
    @keyframes shCore {
      0%, 100% { transform: translateX(-0.1px); }
      50% { transform: translateX(0.1px); }
    }
    @keyframes pRing {
      0% { transform: scale(0.3); opacity: 0.7; }
      100% { transform: scale(2.8); opacity: 0; }
    }
  </style>
</svg>