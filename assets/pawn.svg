<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <defs>
    <!-- Fundo de icone premium com vinheta radial -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1e2229"/>
      <stop offset="60%" stop-color="#111318"/>
      <stop offset="100%" stop-color="#08090c"/>
    </radialGradient>

    <filter id="shadowBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.8"/>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5"/>
    </filter>

    <!-- Metal 3D de alto contraste para leitura em tamanhos pequenos -->
    <linearGradient id="metalBody" x1="16" y1="0" x2="84" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b0d10"/>
      <stop offset="12%" stop-color="#282e38"/>
      <stop offset="25%" stop-color="#788699"/>
      <stop offset="34%" stop-color="#ffffff"/>
      <stop offset="43%" stop-color="#8b99ad"/>
      <stop offset="58%" stop-color="#22272f"/>
      <stop offset="76%" stop-color="#101318"/>
      <stop offset="90%" stop-color="#454f5e"/>
      <stop offset="100%" stop-color="#0b0d10"/>
    </linearGradient>

    <linearGradient id="vLighting" x1="0" y1="16" x2="0" y2="82" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="28%" stop-color="#000000" stop-opacity="0.12"/>
      <stop offset="48%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="52.5%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="55.5%" stop-color="#000000" stop-opacity="0.65"/>
      <stop offset="78%" stop-color="#000000" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.85"/>
    </linearGradient>

    <linearGradient id="rimGlow" x1="16" y1="0" x2="84" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="20%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="34%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="48%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="75%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="88%" stop-color="#b0c2de" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="ringGlow" x1="25" y1="0" x2="75" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="34%" stop-color="#ffffff" stop-opacity="0.65"/>
      <stop offset="55%" stop-color="#000000" stop-opacity="0.4"/>
      <stop offset="85%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="totemClip">
      <path d="M 46,18 C 46,16 54,16 54,18 L 53.5,35 C 55,38 58,40 64,42 C 74,45 84,47 84,52 C 84,57 74,59 64,62 C 58,64 54,66 53,70 L 51.5,81 C 51,82.5 49,82.5 48.5,81 L 47,70 C 46,66 42,64 36,62 C 26,59 16,57 16,52 C 16,47 26,45 36,42 C 42,40 45,38 46.5,35 Z"/>
    </clipPath>
  </defs>

  <!-- Fundo ocupando 100% da area (Compativel com Maskable Icon) -->
  <rect width="100" height="100" fill="url(#bgGrad)" rx="18"/>

  <!-- Brilho ambiental sutil atras do piao -->
  <circle cx="50" cy="50" r="28" fill="#4a5a70" opacity="0.15" filter="url(#softGlow)"/>

  <!-- Sombra na base -->
  <ellipse cx="49" cy="83.5" rx="17" ry="2.8" fill="#000000" opacity="0.7" filter="url(#shadowBlur)"/>
  <ellipse cx="50" cy="82.2" rx="4.8" ry="1" fill="#000000" opacity="0.95"/>

  <!-- Piao estatico em pose heroica (levemente inclinado em -2 graus) -->
  <g transform="rotate(-2 50 81)">
    <g clip-path="url(#totemClip)">
      <rect x="0" y="0" width="100" height="100" fill="url(#metalBody)"/>

      <!-- Feixe de reflexo estatico esfumacado -->
      <path d="M 47,16 L 52,16 L 52,35 C 55,40 63,45 70,52 C 63,59 55,64 51,70 L 50,82 L 48,70 C 42,64 30,59 24,52 C 30,45 42,40 47,35 Z" fill="#ffffff" opacity="0.22" filter="url(#softGlow)"/>

      <rect x="0" y="0" width="100" height="100" fill="url(#vLighting)"/>

      <!-- Aneis de aco torneado -->
      <path d="M 46.5,24 C 46.5,24.6 53.5,24.6 53.5,24" fill="none" stroke="url(#ringGlow)" stroke-width="0.4"/>
      <path d="M 46.2,35 C 46.2,35.9 53.8,35.9 53.8,35" fill="none" stroke="#0b0d10" stroke-width="0.45" opacity="0.55"/>
      <path d="M 38,40.5 C 38,42.3 62,42.3 62,40.5" fill="none" stroke="url(#ringGlow)" stroke-width="0.45" opacity="0.8"/>
      <path d="M 25,46.5 C 25,49.2 75,49.2 75,46.5" fill="none" stroke="url(#ringGlow)" stroke-width="0.5" opacity="0.85"/>
      <path d="M 27,59 C 27,61.6 73,61.6 73,59" fill="none" stroke="url(#ringGlow)" stroke-width="0.45" opacity="0.6"/>
      <path d="M 38,64 C 38,66 62,66 62,64" fill="none" stroke="#0b0d10" stroke-width="0.45" opacity="0.55"/>
      <path d="M 47.5,73 C 47.5,74 52.5,74 52.5,73" fill="none" stroke="url(#ringGlow)" stroke-width="0.4" opacity="0.65"/>

      <!-- Crista Equatorial Polida -->
      <path d="M 16,52 C 16,55.8 30,58.8 50,58.8 C 70,58.8 84,55.8 84,52" fill="none" stroke="#08090c" stroke-width="1.2" opacity="0.9"/>
      <path d="M 16,51.7 C 16,55.5 30,58.5 50,58.5 C 70,58.5 84,55.5 84,51.7" fill="none" stroke="url(#rimGlow)" stroke-width="0.9"/>
    </g>

    <!-- Topo da haste -->
    <ellipse cx="50" cy="17.5" rx="4" ry="0.85" fill="url(#metalBody)" stroke="#16191d" stroke-width="0.4"/>
    <ellipse cx="49" cy="17.4" rx="2.1" ry="0.38" fill="#ffffff" opacity="0.7"/>

    <!-- Contorno Externo -->
    <path d="M 46,18 C 46,16 54,16 54,18 L 53.5,35 C 55,38 58,40 64,42 C 74,45 84,47 84,52 C 84,57 74,59 64,62 C 58,64 54,66 53,70 L 51.5,81 C 51,82.5 49,82.5 48.5,81 L 47,70 C 46,66 42,64 36,62 C 26,59 16,57 16,52 C 16,47 26,45 36,42 C 42,40 45,38 46.5,35 Z" fill="none" stroke="#101216" stroke-width="0.65" stroke-linejoin="round"/>
  </g>
</svg>